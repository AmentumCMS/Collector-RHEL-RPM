name: RHEL RPM Main Collection Sharepoint Upload
on:
  release:
    types: [edited, released]
  workflow_dispatch:
jobs:
  Date:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo "Setting Date"
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo -e "\nWrote to file:\n$GITHUB_OUTPUT\n"
          echo "Values:"
          cat $GITHUB_OUTPUT
      - name: Get disk space
        id: DISK
        run: |
          echo -e "\nUser ID:\n$(id)"
          df -h
          echo -e "\nDisk List"
          sudo fdisk -l | grep -i disk
          echo -e "\nPermissions on /mnt"
          ls -alht /mnt

  # Resolve the collect.yml run for this tag and enumerate its ISOs so the
  # Sharepoint job can fan out over them one-at-a-time. A single ISO can be
  # ~20GB, far more than the small root disk has free, so each runner stages
  # exactly one ISO (plus its sidecar files) on the large /mnt disk.
  Enumerate:
    needs: [Date]
    runs-on: ubuntu-latest
    permissions:
      actions: read       # required so we can query artifacts from another run
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      bases: ${{ steps.find.outputs.bases }}
    steps:
      - name: Resolve source run and ISO list for this tag
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "Looking up the collect.yml artifacts whose names match tag: $TAG"

          # gh --paginate --jq applies the filter to each page and emits the
          # results as a concatenated stream, so pipe through `jq -s` to merge
          # every page into one array. Match on env.TAG to avoid shell quoting.
          ARTIFACTS_JSON=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate \
            --jq '.artifacts[] | select(.name | contains(env.TAG)) | {name, run_id: .workflow_run.id}' \
            | jq -s '.')

          # Pick a single source run (the smallest run id) and keep only its artifacts,
          # so a tag reused across runs can't mix artifacts from different collections.
          RUN_ID=$(echo "$ARTIFACTS_JSON" | jq -r '[.[].run_id] | unique | min // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::No artifacts found whose name contains tag $TAG"
            exit 1
          fi

          # One matrix leg per ISO: strip the ".iso" suffix to get a base name
          # (e.g. epel-9-20260902-0526) that also prefixes its .iso.sha/.iso.txt/.log
          # sidecars, so each leg can pull the whole set with a single pattern.
          BASES=$(echo "$ARTIFACTS_JSON" \
            | jq -c --argjson run_id "$RUN_ID" \
              '[.[] | select(.run_id == $run_id) | .name | select(endswith(".iso")) | sub("\\.iso$";"")] | unique')

          if [ "$BASES" = "[]" ]; then
            echo "::error::No .iso artifacts found for tag $TAG (run $RUN_ID)"
            exit 1
          fi

          echo "Resolved run id: $RUN_ID for tag $TAG"
          echo "ISO bases to upload: $BASES"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "bases=$BASES" >> "$GITHUB_OUTPUT"

  Sharepoint:
    needs: [Date, Enumerate]
    runs-on: ubuntu-latest
    permissions:
      actions: read       # required so download-artifact can pull from another run
    # One ISO per runner. An ISO can be ~20GB but the root disk (which holds
    # GITHUB_WORKSPACE) has only ~20GB free, so we bind-mount the workspace onto
    # the large /mnt disk (~74GB). The upstream Sharepoint action is a Docker
    # action that only sees GITHUB_WORKSPACE -- backing it with /mnt keeps both
    # the download and the containerized upload on the big disk, no script needed.
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        base: ${{ fromJson(needs.Enumerate.outputs.bases) }}

    steps:
      - name: Back the workspace with the large /mnt disk
        run: |
          echo "Before:"
          df -hT / "$GITHUB_WORKSPACE"
          # Redirect GITHUB_WORKSPACE's storage to /mnt. The bind mount persists
          # for the whole job, so download-artifact writes the ISO to /mnt and the
          # Docker upload action (which mounts GITHUB_WORKSPACE) reads it from /mnt.
          sudo mkdir -p /mnt/workspace
          sudo mount --bind /mnt/workspace "$GITHUB_WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          echo "After:"
          df -hT "$GITHUB_WORKSPACE"

      - name: Download ${{ matrix.base }} (ISO + sidecars)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.base }}.*
          merge-multiple: true
          run-id: ${{ needs.Enumerate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        run: |
          ls -1sh .
          df -h "$GITHUB_WORKSPACE"

      - name: Verify ISO checksum
        run: |
          shopt -s nullglob
          shas=(*.sha)
          if [ ${#shas[@]} -gt 0 ]; then
            sha256sum -c "${shas[@]}"
          else
            echo "No .sha present; skipping checksum verification"
          fi

      # Upload files to Sharepoint
      - name: Send Files to Sharepoint
        uses: amentumcms/sharepoint-file-upload-action@main
        with:
          file_path: "*.*"
          host_name: "${{ secrets.SHAREPOINT_HOST }}"
          site_name: "${{ secrets.SHAREPOINT_SITE }}"
          upload_path: "${{ secrets.SHAREPOINT_BASEPATH }}/${{ vars.COLLECTOR }}/${{ needs.Date.outputs.date }}"
          tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
          client_id: ${{ secrets.SHAREPOINT_APP_ID }}
          client_secret: ${{ secrets.SHAREPOINT_APP_SECRET }}
          login_endpoint: "login.microsoftonline.us"
          graph_endpoint: "graph.microsoft.us"
