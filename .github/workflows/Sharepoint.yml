name: RHEL RPM Main Collection Sharepoint Upload
on:
  release:
    types: [edited, released]
  workflow_dispatch:
jobs:
  Date:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo "Setting Date"
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo -e "\nWrote to file:\n$GITHUB_OUTPUT\n"
          echo "Values:"
          cat $GITHUB_OUTPUT
      - name: Get disk space
        id: DISK
        run: |
          echo -e "\nUser ID:\n$(id)"
          df -h
          echo -e "\nDisk List"
          sudo fdisk -l | grep -i disk
          echo -e "\nPermissions on /mnt"
          ls -alht /mnt

  Sharepoint:
    needs: [Date]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read       # required so download-artifact can query/pull from another run
      pull-requests: read

    steps:
      - name: Determine runner mounts
        run: |
          sudo echo -e "Disk freespace and mounts\n$(df -hT)\n\n$(mount)" | tee runner-disks.txt

      - name: Resolve source run for this tag
        id: find_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          echo "Looking up the collect.yml run whose artifacts match tag: $TAG"

          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate \
            --jq ".artifacts[] | select(.name | contains(\"$TAG\")) | .workflow_run.id" \
            | sort -u | head -n1)

          if [ -z "$RUN_ID" ]; then
            echo "::error::No artifacts found whose name contains tag $TAG"
            exit 1
          fi

          echo "Resolved run id: $RUN_ID for tag $TAG"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Artifacts
        run: |
          echo -e "Artifacts Downloaded\n$(find . -type f -iname *sha -execdir sha256sum -c {} \;)"

      - name: Show Artifacts
        run: ls -1sh .

      # Upload files to Sharepoint
      - name: Send Files to Sharepoint
        uses: amentumcms/sharepoint-file-upload-action@main
        with:
          file_path: "${{ vars.COLLECTOR }}-*.*"
          host_name: "${{ secrets.SHAREPOINT_HOST }}"
          site_name: "${{ secrets.SHAREPOINT_SITE }}"
          upload_path: "${{ secrets.SHAREPOINT_BASEPATH }}/${{ vars.COLLECTOR }}/${{ needs.Date.outputs.date }}"
          tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
          client_id: ${{ secrets.SHAREPOINT_APP_ID }}
          client_secret: ${{ secrets.SHAREPOINT_APP_SECRET }}
          login_endpoint: "login.microsoftonline.us"
          graph_endpoint: "graph.microsoft.us"
