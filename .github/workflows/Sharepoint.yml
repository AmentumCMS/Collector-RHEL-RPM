name: RHEL RPM Main Collection Sharepoint Upload
on:
  release:
    types: [edited, released]
  workflow_dispatch:
jobs:
  Date:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo "Setting Date"
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo -e "\nWrote to file:\n$GITHUB_OUTPUT\n"
          echo "Values:"
          cat $GITHUB_OUTPUT
      - name: Get disk space
        id: DISK
        run: |
          echo -e "\nUser ID:\n$(id)"
          df -h
          echo -e "\nDisk List"
          sudo fdisk -l | grep -i disk
          echo -e "\nPermissions on /mnt"
          ls -alht /mnt

  # Resolve the collect.yml run for this tag and enumerate its artifacts so the
  # Sharepoint job can fan out over them one-at-a-time (a single runner can't
  # hold every ISO at once -- that overflows the small workspace disk).
  Enumerate:
    needs: [Date]
    runs-on: ubuntu-latest
    permissions:
      actions: read       # required so we can query artifacts from another run
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      artifacts: ${{ steps.find.outputs.artifacts }}
    steps:
      - name: Resolve source run and artifact list for this tag
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "Looking up the collect.yml artifacts whose names match tag: $TAG"

          # gh --paginate --jq applies the filter to each page and emits the
          # results as a concatenated stream, so pipe through `jq -s` to merge
          # every page into one array. Match on env.TAG to avoid shell quoting.
          ARTIFACTS_JSON=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate \
            --jq '.artifacts[] | select(.name | contains(env.TAG)) | {name, run_id: .workflow_run.id}' \
            | jq -s '.')

          # Pick a single source run (the smallest run id) and keep only its artifacts,
          # so a tag reused across runs can't mix artifacts from different collections.
          RUN_ID=$(echo "$ARTIFACTS_JSON" | jq -r '[.[].run_id] | unique | min // empty')

          if [ -z "$RUN_ID" ]; then
            echo "::error::No artifacts found whose name contains tag $TAG"
            exit 1
          fi

          NAMES=$(echo "$ARTIFACTS_JSON" \
            | jq -c --argjson run_id "$RUN_ID" '[.[] | select(.run_id == $run_id) | .name] | unique')

          echo "Resolved run id: $RUN_ID for tag $TAG"
          echo "Artifacts to upload: $NAMES"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifacts=$NAMES" >> "$GITHUB_OUTPUT"

  Sharepoint:
    needs: [Date, Enumerate]
    runs-on: ubuntu-latest
    permissions:
      actions: read       # required so download-artifact can pull from another run
    # One artifact per runner: the full ISO set is far larger than any single
    # runner's disk, so we never download more than one at a time. fail-fast off
    # so one repo's failure doesn't cancel every other upload.
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        artifact: ${{ fromJson(needs.Enumerate.outputs.artifacts) }}

    steps:
      - name: Free up workspace disk space
        run: |
          echo "Before cleanup:"
          df -hT .
          # Reclaim ~20-30GB of preinstalled toolchains we don't need, giving the
          # large ISOs headroom on the root filesystem (the only disk the docker
          # upload action can see).
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "After cleanup:"
          df -hT .

      - name: Download artifact ${{ matrix.artifact }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ needs.Enumerate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show downloaded files
        run: |
          ls -1sh .
          df -h .

      # Upload files to Sharepoint
      - name: Send Files to Sharepoint
        uses: amentumcms/sharepoint-file-upload-action@main
        with:
          file_path: "*.*"
          host_name: "${{ secrets.SHAREPOINT_HOST }}"
          site_name: "${{ secrets.SHAREPOINT_SITE }}"
          upload_path: "${{ secrets.SHAREPOINT_BASEPATH }}/${{ vars.COLLECTOR }}/${{ needs.Date.outputs.date }}"
          tenant_id: ${{ secrets.SHAREPOINT_TENANT_ID }}
          client_id: ${{ secrets.SHAREPOINT_APP_ID }}
          client_secret: ${{ secrets.SHAREPOINT_APP_SECRET }}
          login_endpoint: "login.microsoftonline.us"
          graph_endpoint: "graph.microsoft.us"
